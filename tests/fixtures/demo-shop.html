<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Checkout · Chai & Co (demo)</title>
<style>
  body { margin: 0; font: 15px/1.5 system-ui, sans-serif; background: #f6f3ee; color: #2b2622; }
  header { padding: 18px 40px; background: #2b2622; color: #f6f3ee; font-weight: 700; font-size: 18px; border-radius: 0 0 16px 16px; }
  main { display: grid; grid-template-columns: 1.3fr 1fr; gap: 28px; padding: 32px 40px; max-width: 1100px; }
  .card { background: #fff; border-radius: 16px; padding: 22px 26px; box-shadow: 0 2px 12px rgba(0,0,0,.06); }
  h2 { margin: 0 0 14px; font-size: 18px; }
  label { display: block; margin: 12px 0 4px; font-size: 13px; color: #6b625b; }
  input { width: 100%; box-sizing: border-box; padding: 10px 12px; border: 1px solid #d8d0c7; border-radius: 10px; font: inherit; }
  .row { display: flex; gap: 12px; } .row > div { flex: 1; }
  button { margin-top: 18px; width: 100%; padding: 12px; border: 0; border-radius: 12px; background: #c2410c; color: #fff; font: 600 16px system-ui; }
  .item { display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid #f0ebe4; }
  .total { font-weight: 700; font-size: 17px; border: 0; padding-top: 14px; }
</style></head>
<body>
<header>☕ Chai &amp; Co <span style="font-weight:400;opacity:.7">· a made-up demo shop</span></header>
<main>
  <section class="card">
    <h2>Payment</h2>
    <label for="name">Name on card</label><input id="name" value="Asha Rao">
    <label for="cc">Card number</label><input id="cc" autocomplete="cc-number" placeholder="1234 5678 9012 3456">
    <div class="row"><div><label for="exp">Expiry</label><input id="exp" autocomplete="cc-exp" placeholder="MM / YY"></div>
    <div><label for="cvv">CVV</label><input id="cvv" autocomplete="cc-csc" placeholder="123"></div></div>
    <button id="pay">Pay ₹649</button>
  </section>
  <aside class="card">
    <h2>Your order</h2>
    <div class="item"><span>Masala chai, 250 g</span><span>₹349</span></div>
    <div class="item"><span>Ginger biscuits</span><span>₹220</span></div>
    <div class="item"><span>Delivery</span><span>₹80</span></div>
    <div class="item total"><span>Total</span><span>₹649</span></div>
  </aside>
</main>
</body></html>
