<!doctype html><html><head><meta charset="utf-8"><title>Checkout</title></head>
<body><h1>Checkout</h1>
<form id="pay"><label>Card number <input id="cc" autocomplete="cc-number"></label>
<label>Password <input id="pw" type="password"></label>
<label>Coupon <input id="coupon"></label>
<button id="paybtn" type="submit">Pay now</button></form>
<p id="paid">not paid</p>
<script>document.getElementById('pay').onsubmit = (e) => { e.preventDefault(); document.getElementById('paid').textContent = 'paid'; };</script></body></html>
