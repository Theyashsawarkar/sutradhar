<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>sutradhar · idle</title>
<link rel="icon" href="icons/icon-32.png">
<style>
  :root { --bg:#eff1f5; --card:#e6e9ef; --text:#4c4f69; --sub:#6c6f85; --accent:#8839ef; }
  @media (prefers-color-scheme: dark) { :root { --bg:#1e1e2e; --card:#181825; --text:#cdd6f4; --sub:#a6adc8; --accent:#cba6f7; } }
  html, body { height: 100%; margin: 0; }
  body { display: grid; place-items: center; background: var(--bg); color: var(--text); font: 15px/1.5 system-ui, sans-serif; }
  .card { text-align: center; padding: 36px 44px; border-radius: 24px; background: var(--card); max-width: 460px; }
  img.logo { width: 88px; height: 88px; }
  h1 { margin: 14px 0 6px; font-size: 20px; }
  p { margin: 6px 0; color: var(--sub); }
  b { color: var(--accent); }
  img.verse { width: 100%; margin-top: 18px; }
</style>
</head>
<body>
  <div class="card">
    <img class="logo" src="icons/logo.svg" alt="">
    <h1>sutradhar is idle</h1>
    <p>This is sutradhar's tab, in the <b>sutra</b> group. When an agent needs the browser, it works here, in the background, while you use your own tabs.</p>
    <p>Open this tab any time to watch it work.</p>
    <img class="verse" src="icons/shloka.svg" alt="Bhagavad Gītā 7.7">
  </div>
</body>
</html>
