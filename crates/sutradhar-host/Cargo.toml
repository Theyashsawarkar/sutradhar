[package]
name = "sutradhar-host"
# Released with sutradhar (package.json has the version); the binary never reports one.
version = "0.0.0"
edition = "2024"
description = "sutradhar's native-messaging host: relays a browser's stdio to the daemon's socket in a few hundred KB"
license = "MIT"
publish = false

[dependencies]

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
